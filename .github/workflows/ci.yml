name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make proto

      - name: Build
        run: make build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make proto

      - name: Run unit tests
        run: make test

      - name: Run integration tests
        run: make test-integration

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make proto

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  chaos-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make proto

      - name: Run chaos tests
        run: make chaos-test

  chaos-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make proto

      - name: Build
        run: make build

      - name: Start cluster
        run: |
          mkdir -p /tmp/forgekv/n1 /tmp/forgekv/n2 /tmp/forgekv/n3
          ./bin/forgekv node --id n1 --data-dir /tmp/forgekv/n1 \
            --client-addr 127.0.0.1:9001 --raft-addr 127.0.0.1:9101 --admin-addr 127.0.0.1:9201 \
            --metrics-addr 127.0.0.1:9301 \
            --peers n1=127.0.0.1:9101,n2=127.0.0.1:9102,n3=127.0.0.1:9103 &
          ./bin/forgekv node --id n2 --data-dir /tmp/forgekv/n2 \
            --client-addr 127.0.0.1:9002 --raft-addr 127.0.0.1:9102 --admin-addr 127.0.0.1:9202 \
            --metrics-addr 127.0.0.1:9302 \
            --peers n1=127.0.0.1:9101,n2=127.0.0.1:9102,n3=127.0.0.1:9103 &
          ./bin/forgekv node --id n3 --data-dir /tmp/forgekv/n3 \
            --client-addr 127.0.0.1:9003 --raft-addr 127.0.0.1:9103 --admin-addr 127.0.0.1:9203 \
            --metrics-addr 127.0.0.1:9303 \
            --peers n1=127.0.0.1:9101,n2=127.0.0.1:9102,n3=127.0.0.1:9103 &
          sleep 10

      - name: Run smoke test
        run: |
          ./bin/forgekvctl status --any
          ./bin/forgekvctl put --key testkey --value testvalue --client ci --seq 1
          ./bin/forgekvctl get --key testkey
          RESULT=$(./bin/forgekvctl get --key testkey 2>&1)
          if [[ "$RESULT" != *"testvalue"* ]]; then
            echo "Unexpected result: $RESULT"
            exit 1
          fi

      - name: Stop cluster
        if: always()
        run: |
          pkill -f "forgekv node" || true
          rm -rf /tmp/forgekv
