syntax = "proto3";

package forgekv.v1;

option go_package = "github.com/forgekv/forgekv/api/forgekv";

service KV {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CAS(CASRequest) returns (CASResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

service Admin {
  rpc SetLinkRule(SetLinkRuleRequest) returns (SetLinkRuleResponse);
  rpc ClearLinkRules(ClearLinkRulesRequest) returns (ClearLinkRulesResponse);
  rpc SetDiskStall(SetDiskStallRequest) returns (SetDiskStallResponse);
  rpc Crash(CrashRequest) returns (CrashResponse);
}

// Internal Raft transport service
service RaftTransport {
  rpc SendMessage(RaftMessageRequest) returns (RaftMessageResponse);
  rpc SendSnapshot(stream SnapshotChunk) returns (SnapshotResponse);
}

enum Code {
  CODE_UNSPECIFIED = 0;
  OK = 1;
  NOT_LEADER = 2;
  NO_QUORUM = 3;
  OVERLOADED = 4;
  OUT_OF_ORDER = 5;
  INVALID_ARGUMENT = 6;
  INTERNAL = 7;
}

message Error {
  Code code = 1;
  string message = 2;
  LeaderHint leader_hint = 3;
}

message LeaderHint {
  string node_id = 1;
  string client_addr = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  string client_id = 3;
  uint64 seq = 4;
}

message PutResponse {
  Error error = 1;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  Error error = 1;
  bytes value = 2;
  bool found = 3;
}

message DeleteRequest {
  bytes key = 1;
  string client_id = 2;
  uint64 seq = 3;
}

message DeleteResponse {
  Error error = 1;
}

message CASRequest {
  bytes key = 1;
  bytes expected = 2;
  bytes desired = 3;
  string client_id = 4;
  uint64 seq = 5;
}

message CASResponse {
  Error error = 1;
  bool swapped = 2;
  bytes current = 3;
  bool found = 4;
}

message StatusRequest {}

message StatusResponse {
  Error error = 1;
  string node_id = 2;
  bool is_leader = 3;
  string leader_id = 4;
  string leader_client_addr = 5;
  uint64 term = 6;
  uint64 commit_index = 7;
  uint64 applied_index = 8;
  uint64 millis_since_quorum = 9;
  map<string, uint64> peer_replication_lag = 10;
}

message SetLinkRuleRequest {
  string src_node_id = 1;
  string dst_node_id = 2;
  uint32 drop_pct = 3;
  uint32 delay_ms = 4;
  uint32 jitter_ms = 5;
}

message SetLinkRuleResponse {
  Error error = 1;
}

message ClearLinkRulesRequest {}

message ClearLinkRulesResponse {
  Error error = 1;
}

message SetDiskStallRequest {
  uint32 fsync_delay_ms = 1;
}

message SetDiskStallResponse {
  Error error = 1;
}

message CrashRequest {
  uint32 exit_code = 1;
}

message CrashResponse {
  Error error = 1;
}

// Internal Raft messages
message RaftMessageRequest {
  bytes message = 1;
}

message RaftMessageResponse {
  Error error = 1;
}

message SnapshotChunk {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
  bool done = 4;
}

message SnapshotResponse {
  Error error = 1;
}

// Internal proposal encoding
message Proposal {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    PUT = 1;
    DELETE = 2;
    CAS = 3;
  }
  Type type = 1;
  bytes key = 2;
  bytes value = 3;
  bytes expected = 4;
  bytes desired = 5;
  string client_id = 6;
  uint64 seq = 7;
}

// Session state stored in Pebble
message SessionRecord {
  uint64 last_seq = 1;
  bytes last_reply = 2;
  uint64 last_seen_index = 3;
}

// Reply cache entry
message CachedReply {
  Code code = 1;
  string message = 2;
  bool swapped = 3;
  bytes current = 4;
  bool found = 5;
}
